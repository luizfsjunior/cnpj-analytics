# Os serviços levam o sufixo -cnpj-rfb de propósito. No servidor eles entram na
# rede externa compartilhada `services-net`, onde o Compose publica o nome do
# serviço como alias de DNS — um serviço chamado "postgres" colidiria com o
# banco do Airflow, que também está lá, e as conexões cairiam no banco errado.
services:

  postgres-cnpj-rfb:
    image: postgres:18-trixie
    # shared_buffers: 128 MB (default) -> 1 GB. É a decisão 3 da spec-carga.md, e
    # a medição que a motiva é direta: 14 GB de índice mantidos vivos através de
    # 128 MB de cache, com o INSERT parado em `DataFileRead` — a causa apontada
    # para 16 das ~20 horas da carga antiga. Ajuda as DUAS fases caras, o
    # transform e a construção dos índices.
    #
    # Por que aqui e não por `ALTER SYSTEM`: shared_buffers exige RESTART, então
    # ele não pode sair do load.sh (que só faz reload). No compose ele sobrevive
    # à recriação do container e fica versionado junto do resto.
    #
    # ⚠️ Este valor NÃO é aplicado pelo deploy: o workflow sobe o postgres com
    # `--no-recreate` de propósito, para nunca derrubar o banco. Para valer, o
    # container precisa ser recriado À MÃO, numa janela sem carga:
    #   docker compose -p cnpj-analytics up -d postgres-cnpj-rfb
    #
    # No servidor este 1 GB sai do mesmo teto de 3 GB do orçamento da carga: é o
    # que a tabela da seção 7.3 da spec chama de "sobra para a fase = 2 GB".
    command:
      - postgres
      - -c
      - shared_buffers=1GB
    # /dev/shm (tmpfs) para os parallel workers. Default do Docker é 64MB e
    # estoura ao criar as materialized views (GROUP BY sobre ~122M estabelecimentos).
    shm_size: "512m"
    ports:
      - 5435:5432
    volumes:
      - ${CNPJ_HOST_DATA_DIR:-./data}/postgres:/var/lib/postgresql
    environment:
      POSTGRES_PASSWORD: cnpj
      POSTGRES_USER: cnpj
      POSTGRES_DB: cnpj
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'pg_isready -U $${POSTGRES_USER}'"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-cnpj-rfb:
    build: .
    ports:
      - 8503:8503
    env_file:
      - .env
    depends_on:
      postgres-cnpj-rfb:
        condition: service_healthy

# O serviço `watcher-cnpj-rfb` foi REMOVIDO em 22/09/2026 (decisão D1 da
# `airflow/spec-dag-carga.md`): quem dispara a carga mensal agora é a DAG
# `cnpj_carga_mensal` do Airflow. Ele não ficou desligado nem de fallback —
# enquanto os dois existissem, o R1 (nunca duas cargas ao mesmo tempo) não
# valeria nada: `max_active_runs` e o pool do Airflow não enxergam um daemon
# que roda fora dele.
#
# O `watcher/` continua no repo, e é proposital: a DAG importa dele
# `fetch_available_months` e `download_month` (R2), e o `watcher/Dockerfile` é a
# imagem `cnpj-carga` que o DockerOperator executa. O que saiu foi o LOOP, não o
# código.
#
# O volume nomeado `cnpj-analytics_watcher_state` (o `state.json`) deixou de ser
# declarado aqui, mas NÃO é apagado pelo deploy: o `--remove-orphans` mata o
# container órfão, não o volume. A fonte da verdade sobre o último mês carregado
# passa a ser `carga.resumo` (R6). Para removê-lo, à mão e sem pressa:
#     docker volume rm cnpj-analytics_watcher_state
