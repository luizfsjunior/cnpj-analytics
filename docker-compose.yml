# Os serviços levam o sufixo -cnpj-rfb de propósito. No servidor eles entram na
# rede externa compartilhada `services-net`, onde o Compose publica o nome do
# serviço como alias de DNS — um serviço chamado "postgres" colidiria com o
# banco do Airflow, que também está lá, e as conexões cairiam no banco errado.
services:

  postgres-cnpj-rfb:
    image: postgres:18-trixie
    # shared_buffers: 128 MB (default) -> 1 GB. É a decisão 3 da spec-carga.md, e
    # a medição que a motiva é direta: 14 GB de índice mantidos vivos através de
    # 128 MB de cache, com o INSERT parado em `DataFileRead` — a causa apontada
    # para 16 das ~20 horas da carga antiga. Ajuda as DUAS fases caras, o
    # transform e a construção dos índices.
    #
    # Por que aqui e não por `ALTER SYSTEM`: shared_buffers exige RESTART, então
    # ele não pode sair do load.sh (que só faz reload). No compose ele sobrevive
    # à recriação do container e fica versionado junto do resto.
    #
    # ⚠️ Este valor NÃO é aplicado pelo deploy: o workflow sobe o postgres com
    # `--no-recreate` de propósito, para nunca derrubar o banco. Para valer, o
    # container precisa ser recriado À MÃO, numa janela sem carga:
    #   docker compose -p cnpj-analytics up -d postgres-cnpj-rfb
    #
    # No servidor este 1 GB sai do mesmo teto de 3 GB do orçamento da carga: é o
    # que a tabela da seção 7.3 da spec chama de "sobra para a fase = 2 GB".
    command:
      - postgres
      - -c
      - shared_buffers=1GB
    # /dev/shm (tmpfs) para os parallel workers. Default do Docker é 64MB e
    # estoura ao criar as materialized views (GROUP BY sobre ~122M estabelecimentos).
    shm_size: "512m"
    ports:
      - 5435:5432
    volumes:
      - ${CNPJ_HOST_DATA_DIR:-./data}/postgres:/var/lib/postgresql
    environment:
      POSTGRES_PASSWORD: cnpj
      POSTGRES_USER: cnpj
      POSTGRES_DB: cnpj
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'pg_isready -U $${POSTGRES_USER}'"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-cnpj-rfb:
    build: .
    ports:
      - 8503:8503
    env_file:
      - .env
    depends_on:
      postgres-cnpj-rfb:
        condition: service_healthy

  watcher-cnpj-rfb:
    build:
      context: .
      dockerfile: watcher/Dockerfile
    depends_on:
      postgres-cnpj-rfb:
        condition: service_healthy
    environment:
      # Conexão direta com o postgres (sem socket do Docker). Ver load.sh.
      PGHOST: postgres-cnpj-rfb
      PGPORT: 5432
      PGUSER: cnpj
      PGPASSWORD: cnpj
      # Config do watcher (defaults do watcher.py; ajuste se necessário).
      CNPJ_DB: cnpj_full
      CNPJ_DATA_DIR: /data
      CNPJ_STATE_FILE: /state/state.json
      CHECK_INTERVAL_H: "24"
      LOAD_AFTER_HOUR: "22"
      # Orçamento da carga. O Compose só repassa ao container as variáveis
      # listadas AQUI — pôr `ORCAMENTO_RAM_MB` no .env do servidor não basta se
      # ela não aparecer nesta lista. O default 3072 é o teto da seção 7.3 da
      # spec: o host é compartilhado (8 vCPU e 16 GB com Airflow, Kong e
      # Traefik) e NÃO tem swap, então passar do teto é OOM kill, não lentidão.
      ORCAMENTO_RAM_MB: "${ORCAMENTO_RAM_MB:-3072}"
      ORCAMENTO_VCPU: "${ORCAMENTO_VCPU:-4}"
      # Vazias por padrão: a Fase 0 as deriva do host. Só defina no .env para
      # forçar um valor — e lembre que a Fase 0 ainda pode degradá-las se o
      # host estiver ocupado, que é o comportamento desejado.
      LOAD_JOBS: "${LOAD_JOBS:-}"
      IDX_JOBS: "${IDX_JOBS:-}"
      CARGA_TRANSFORM: "${CARGA_TRANSFORM:-blocos}"
      REJEITO_LIMIAR_PCT: "${REJEITO_LIMIAR_PCT:-0.1}"
      CONTAR_DUP_SOCIO: "${CONTAR_DUP_SOCIO:-0}"
      # Nome antigo do orçamento, em GB. Continua funcionando para instalações
      # que já o tinham; `ORCAMENTO_RAM_MB` tem prioridade quando os dois vêm.
      TUNE_RAM_GB: "${TUNE_RAM_GB:-}"
      # Teto de duração de uma carga completa. 72h porque no servidor a carga
      # cheia (~122M estabelecimentos) já passou de 20h, o default do load.sh.
      LOAD_TIMEOUT_H: "${LOAD_TIMEOUT_H:-72}"
    volumes:
      # Pasta com os zips da Receita, no HOST. No servidor CNPJ_HOST_DATA_DIR
      # aponta para fora da árvore de deploy (o rsync do CI não pode encostar
      # nos ~72 GB); local, o default ./data basta.
      - ${CNPJ_HOST_DATA_DIR:-./data}:/data
      # Persiste o estado (último mês carregado) entre restarts.
      - watcher_state:/state
    restart: unless-stopped

volumes:
  watcher_state:
