# Os serviços levam o sufixo -cnpj-rfb de propósito. No servidor eles entram na
# rede externa compartilhada `services-net`, onde o Compose publica o nome do
# serviço como alias de DNS — um serviço chamado "postgres" colidiria com o
# banco do Airflow, que também está lá, e as conexões cairiam no banco errado.
services:

  postgres-cnpj-rfb:
    image: postgres:18-trixie
    # /dev/shm (tmpfs) para os parallel workers. Default do Docker é 64MB e
    # estoura ao criar as materialized views (GROUP BY sobre ~122M estabelecimentos).
    shm_size: "512m"
    ports:
      - 5435:5432
    volumes:
      - ${CNPJ_HOST_DATA_DIR:-./data}/postgres:/var/lib/postgresql
    environment:
      POSTGRES_PASSWORD: cnpj
      POSTGRES_USER: cnpj
      POSTGRES_DB: cnpj
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'pg_isready -U $${POSTGRES_USER}'"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-cnpj-rfb:
    build: .
    ports:
      - 8503:8503
    env_file:
      - .env
    depends_on:
      postgres-cnpj-rfb:
        condition: service_healthy

  watcher-cnpj-rfb:
    build:
      context: .
      dockerfile: watcher/Dockerfile
    depends_on:
      postgres-cnpj-rfb:
        condition: service_healthy
    environment:
      # Conexão direta com o postgres (sem socket do Docker). Ver load.sh.
      PGHOST: postgres-cnpj-rfb
      PGPORT: 5432
      PGUSER: cnpj
      PGPASSWORD: cnpj
      # Config do watcher (defaults do watcher.py; ajuste se necessário).
      CNPJ_DB: cnpj_full
      CNPJ_DATA_DIR: /data
      CNPJ_STATE_FILE: /state/state.json
      CHECK_INTERVAL_H: "24"
      LOAD_AFTER_HOUR: "22"
      # Orçamento de RAM da carga (knobs calculados a partir daqui).
      TUNE_RAM_GB: "6"
      # Teto de duração de uma carga completa. 72h porque no servidor a carga
      # cheia (~122M estabelecimentos) já passou de 20h, o default do load.sh.
      LOAD_TIMEOUT_H: "${LOAD_TIMEOUT_H:-72}"
    volumes:
      # Pasta com os zips da Receita, no HOST. No servidor CNPJ_HOST_DATA_DIR
      # aponta para fora da árvore de deploy (o rsync do CI não pode encostar
      # nos ~72 GB); local, o default ./data basta.
      - ${CNPJ_HOST_DATA_DIR:-./data}:/data
      # Persiste o estado (último mês carregado) entre restarts.
      - watcher_state:/state
    restart: unless-stopped

volumes:
  watcher_state:
