# ============================================================================
# Exemplo do docker-compose.override.yml do SERVIDOR (srv-controladoria).
#
# O arquivo real NÃO é versionado (é configuração daquele host) e o rsync do
# CI/CD o preserva via --exclude. Este exemplo existe para que a configuração
# não viva só na cabeça de quem tem SSH.
#
# O que ele faz: liga os três serviços à rede externa compartilhada
# `services-net`, por onde as outras stacks (Airflow, Protheus, controladoria)
# enxergam este banco. Não precisa de `aliases`: o Compose já publica o nome do
# serviço como alias de DNS, e os nomes do compose base já têm o sufixo
# -cnpj-rfb justamente para não colidirem nessa rede. Consumidores externos
# conectam em `postgres-cnpj-rfb:5432`.
#
# Uso: copie para docker-compose.override.yml no diretório de deploy.
# ============================================================================
networks:
  services-net:
    external: true

services:
  postgres-cnpj-rfb:
    networks:
      default:
      services-net:

  api-cnpj-rfb:
    networks:
      default:
      services-net:

  watcher-cnpj-rfb:
    networks:
      default:
      services-net:
